name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: PYTHONPATH=. python3 -m pytest tests/ -q
      - name: demo smoke test
        run: sh demo/run_demo.sh
